name: Atualização automática do app

# Publica as mudanças de telas e regras (JavaScript) por EAS Update: o app as
# recebe sozinho ao abrir, sem baixar APK. Mudanças nativas continuam exigindo
# APK novo; a trava "Conferir versão nativa" impede publicar nesse caso.
#
# Configuração (uma vez): secret EXPO_TOKEN e variável EXPO_PROJECT_ID.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'loja/**'
      - '**/*.md'
      - 'supabase/**'
      - '.github/workflows/manter-supabase-ativo.yml'
  workflow_dispatch:

concurrency:
  group: atualizar-app
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - name: Atualizações automáticas configuradas?
        id: config
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EXPO_PROJECT_ID" ]; then
            echo "::notice::Atualização automática desligada: falta o secret EXPO_TOKEN ou a variável EXPO_PROJECT_ID."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.pronto == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.pronto == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.config.outputs.pronto == 'true'

      - name: Testes, tipos e lint
        if: steps.config.outputs.pronto == 'true'
        run: npm test && npm run test:rotas && npm run typecheck && npx eslint .

      - name: Conferir versão nativa
        if: steps.config.outputs.pronto == 'true'
        run: npm run conferir:nativo

      - name: Publicar atualização
        if: steps.config.outputs.pronto == 'true'
        run: |
          npx eas-cli@27.4.0 channel:create producao --non-interactive || true
          npx eas-cli@27.4.0 update --branch producao --platform android --non-interactive \
            --message "$(git log -1 --pretty=%s)"
